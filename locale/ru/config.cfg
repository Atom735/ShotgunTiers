shotguntiers-speed-bonus=Процентный бонус к скорости атаки оружия за каждый следующий тир (уменьшает cooldown).
shotguntiers-ammo-damage-bonus=Процентный бонус к урону боеприпасов за каждый следующий тир (сложный процент).

