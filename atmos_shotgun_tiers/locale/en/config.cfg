[mod-setting-name]
shotguntiers-damage-bonus=Weapon damage bonus per tier
shotguntiers-range-bonus=Weapon range bonus per tier
shotguntiers-speed-bonus=Weapon attack speed bonus per tier
shotguntiers-ammo-damage-bonus=Ammo damage bonus per tier
shotguntiers-pellet-bonus=Extra shotgun pellets per tier

[mod-setting-description]
shotguntiers-damage-bonus=Percent damage bonus applied to weapons for each higher tier (compound).
shotguntiers-range-bonus=Percent range bonus applied to weapons for each higher tier (compound).
shotguntiers-speed-bonus=Percent attack-speed bonus for each higher tier (reduces cooldown).
shotguntiers-ammo-damage-bonus=Percent damage bonus applied to ammo for each higher tier (compound).
shotguntiers-pellet-bonus=Integer pellets added to shotgun / piercing shotgun shells for each higher tier (tier 2 = +N, tier 3 = +2N, ...).

