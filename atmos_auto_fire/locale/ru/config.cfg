debug-tooltip=Круги: дальность оружия (серый), более короткие дальности правил (синий).\nВраги: зелёный = цель, жёлтый = разрешён, красный = линия огня перекрыта, серый = нет подходящего правила. Число — номер строки разрешений.\nПрямоугольники: свои постройки для проверки линии огня, красный = мешает. Линии: конусы выстрела.
allow-title=Разрешения / приоритет
allow-hint=Верхние строки проверяются первыми. ★ Все — любой враг. Дистанция в метрах или в % от дальности текущего оружия.
forbid-title=Никогда не стрелять
