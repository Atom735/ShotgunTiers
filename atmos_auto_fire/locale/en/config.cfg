[mod-name]
atmos_auto_fire=Atmos Auto Fire

[mod-description]
atmos_auto_fire=Automatically fires the held shotgun at prioritized enemies. The character fires itself, with native spread, cooldown, and ammo use.

[shortcut-name]
atmos-auto-fire-toggle=Toggle auto-shotgun

[controls]
atmos-auto-fire-toggle=Toggle auto-shotgun

