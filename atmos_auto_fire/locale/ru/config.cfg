[mod-name]
atmos_auto_fire=Atmos Auto Fire

[mod-description]
atmos_auto_fire=Автоматически стреляет из дробовика в руках по целям в заданном порядке. Стреляет сам персонаж, с родным разбросом, кулдауном и расходом патронов.

[shortcut-name]
atmos-auto-fire-toggle=Переключить автодробовик

[controls]
atmos-auto-fire-toggle=Переключить автодробовик

